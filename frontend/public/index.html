<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="SkillTalk — Connect, Collaborate, and Grow Together!"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://app.skilltalk.in/" />

    <!-- ✅ Favicon and Manifest -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SkillTalk" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <title>SkillTalk | More Than Networking—It’s Skill Chemistry</title>
    
    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SkillTalk",
        "url": "https://app.skilltalk.in/",
        "logo": "https://app.skilltalk.in/favicon-96x96.png",
        "sameAs": [
          "https://app.skilltalk.in/"
        ]
      }
    </script>
    <!-- JSON-LD: Website with SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SkillTalk",
        "url": "https://app.skilltalk.in/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://app.skilltalk.in/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- Process polyfill to prevent "Can't find variable: process" error -->
    <script>
      if (typeof window !== 'undefined' && !window.process) {
        window.process = {
          env: {
            NODE_ENV: 'development'
          },
          nextTick: function(callback) {
            setTimeout(callback, 0);
          },
          emit: function() {},
          on: function() {},
          off: function() {}
        };
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
